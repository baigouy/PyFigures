name: Build Executables

# Trigger on version tags (e.g. v0.1.10) or manually from the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # "PyFigures MCP Edition": the same app whose AI is an outside app (Mistral Vibe,
          # Claude, Hermes...) reaching the open figure through MCP: no chat at start-up,
          # the figure shared at start-up, registration offered at first launch
          # (replaces the web chat app, user 2026-11-24)
          - os: windows-latest
            mcp_app: '1'
            app_name: PyFigures MCP Edition
            artifact_name: PyFigures-MCP-Edition-Windows
            artifact_path: PyFigures-MCP-Edition-Windows.zip
          - os: macos-15-intel
            mcp_app: '1'
            app_name: PyFigures MCP Edition
            artifact_name: PyFigures-MCP-Edition-macOS-Intel
            artifact_path: PyFigures-MCP-Edition-macOS-Intel.dmg
          - os: macos-latest
            mcp_app: '1'
            app_name: PyFigures MCP Edition
            artifact_name: PyFigures-MCP-Edition-macOS-AppleSilicon
            artifact_path: PyFigures-MCP-Edition-macOS-AppleSilicon.dmg
          - os: ubuntu-22.04
            mcp_app: '1'
            app_name: PyFigures MCP Edition
            artifact_name: PyFigures-MCP-Edition-Linux
            artifact_path: PyFigures-MCP-Edition-Linux-x86_64.*
          - os: windows-latest
            app_name: PyFigures
            artifact_name: PyFigures-Windows
            artifact_path: PyFigures-Windows.zip
          - os: macos-15-intel    # Intel x86_64 (macos-13 runners were retired in 2025)
            app_name: PyFigures
            artifact_name: PyFigures-macOS-Intel
            artifact_path: PyFigures-macOS-Intel.dmg
          - os: macos-latest      # Apple Silicon (arm64)
            app_name: PyFigures
            artifact_name: PyFigures-macOS-AppleSilicon
            artifact_path: PyFigures-macOS-AppleSilicon.dmg
          # the oldest supported Ubuntu: the app runs on Linux systems with this
          # glibc (2.35) or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+)
          - os: ubuntu-22.04
            app_name: PyFigures
            artifact_name: PyFigures-Linux
            artifact_path: PyFigures-Linux-x86_64.*
          # "PyFigures NoAI": no chat sidebar, no chat or MCP entries (PYFIGURES_NO_AI
          # also makes pip install the pyfigures-noai distribution, without qtpy-ai-sidecar)
          - os: windows-latest
            no_ai: '1'
            app_name: PyFigures NoAI
            artifact_name: PyFigures-NoAI-Windows
            artifact_path: PyFigures-NoAI-Windows.zip
          - os: macos-15-intel
            no_ai: '1'
            app_name: PyFigures NoAI
            artifact_name: PyFigures-NoAI-macOS-Intel
            artifact_path: PyFigures-NoAI-macOS-Intel.dmg
          - os: macos-latest
            no_ai: '1'
            app_name: PyFigures NoAI
            artifact_name: PyFigures-NoAI-macOS-AppleSilicon
            artifact_path: PyFigures-NoAI-macOS-AppleSilicon.dmg
          - os: ubuntu-22.04
            no_ai: '1'
            app_name: PyFigures NoAI
            artifact_name: PyFigures-NoAI-Linux
            artifact_path: PyFigures-NoAI-Linux-x86_64.*

    env:
      PYFIGURES_MCP_APP: ${{ matrix.mcp_app || '0' }}
      PYFIGURES_NO_AI: ${{ matrix.no_ai || '0' }}
      APP_NAME: ${{ matrix.app_name }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3.12, not 3.10: zarr 3 (newer OME-Zarr files) needs 3.11+, and PyMuPDF,
      # which the apps download on request, only has wheels for 3.11+
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Install pyfigures and its dependencies
        # the chat sidebar (qtpy-ai-sidecar) comes with pyfigures itself, and the
        # self-test below fails the build without it; no [pdf] extra: PyMuPDF is
        # AGPL, the apps read PDFs with pypdfium2. Retried while a just-released
        # dependency is not yet on the runners' PyPI mirror.
        shell: bash
        run: bash .github/scripts/pip_install_retry.sh ".[video,zarr,fiji]"

      # The app bundles GPL/LGPL code (PyQt6, Qt, FFmpeg + x264/x265), so it is
      # distributed under the GPLv3: licence texts go inside the bundle and the
      # corresponding source is attached to the release (see the release job).
      - name: Collect licence notices
        run: python packaging/collect_licenses.py notices third_party

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Build with PyInstaller
        run: pyinstaller pyfigures.spec

      # the built app checks its own contents (Qt SVG, PDF panels with
      # pypdfium2 and no PyMuPDF, H.264 encoder, zarr); fails the build if not
      - name: Self-test of the built app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) APP="dist/$APP_NAME/$APP_NAME.exe" ;;
            macOS) APP="dist/$APP_NAME.app/Contents/MacOS/$APP_NAME" ;;
            *) APP="dist/$APP_NAME/$APP_NAME" ;;
          esac
          QT_QPA_PLATFORM=offscreen "$APP" --self-test self_test.json || { cat self_test.json; exit 1; }
          cat self_test.json

      # what an AI app registered in Tools > MCP server… starts: the app's own MCP server
      - name: MCP server of the built app
        if: matrix.no_ai != '1'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) APP="dist/$APP_NAME/PyFigures MCP.exe" ;;
            macOS) APP="dist/$APP_NAME.app/Contents/MacOS/$APP_NAME" ;;
            *) APP="dist/$APP_NAME/$APP_NAME" ;;
          esac
          python .github/scripts/check_mcp_server.py "$APP"

      - name: Licence files next to the executable too (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: cp third_party/THIRD_PARTY_LICENSES.txt third_party/SOURCES.md "dist/$APP_NAME/"

      - name: Upload the source manifest
        uses: actions/upload-artifact@v4
        with:
          name: sources-${{ matrix.artifact_name }}
          path: third_party/sources.json
          retention-days: 30

      # -----------------------------------------------------------------------
      # Package — Windows
      # -----------------------------------------------------------------------
      - name: Package (Windows — zip)
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Path "dist\$env:APP_NAME" -DestinationPath ${{ matrix.artifact_path }}

      # -----------------------------------------------------------------------
      # Package — Linux (portable .tar.gz + AppImage)
      # -----------------------------------------------------------------------
      - name: Package (Linux — tar.gz and AppImage)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          bash packaging/make_linux_packages.sh dist ./appimagetool "$APP_NAME"

      # the AppImage itself runs (unpacked: no FUSE on the runner)
      - name: Self-test of the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE="./${APP_NAME// /-}-Linux-x86_64.AppImage"      # PyFigures-Linux-x86_64.AppImage --self-test, or PyFigures-NoAI-…
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen "$APPIMAGE" --self-test appimage_test.json || { cat appimage_test.json; exit 1; }
          cat appimage_test.json

      # -----------------------------------------------------------------------
      # Package — macOS (.app → .dmg)
      # -----------------------------------------------------------------------
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # The photo album and poster designers: small launcher apps running
      # PyFigures.app --album / --poster (on Windows they are "PyFigures Album.exe"
      # and "PyFigures Poster.exe", built by pyfigures.spec)
      # (the no-AI app has them too, opening "PyFigures NoAI.app"; the MCP Edition
      # is the figure editor only)
      - name: Album and poster launchers (macOS)
        if: runner.os == 'macOS' && matrix.mcp_app != '1'
        run: |
          bash packaging/make_macos_launcher_apps.sh dist "$(python -c 'from pyfigures.version import __VERSION__; print(__VERSION__)')" "$APP_NAME"

      - name: Package (macOS — dmg, MCP Edition)
        if: runner.os == 'macOS' && matrix.mcp_app == '1'
        run: |
          mkdir dmg_src
          cp -R "dist/$APP_NAME.app" dmg_src/
          create-dmg \
            --volname "$APP_NAME" \
            --window-size 600 300 \
            --icon-size 90 \
            --icon "$APP_NAME.app" 150 140 \
            --app-drop-link 450 140 \
            ${{ matrix.artifact_path }} \
            dmg_src

      - name: Package (macOS — dmg)
        if: runner.os == 'macOS' && matrix.mcp_app != '1'
        run: |
          mkdir dmg_src
          cp -R "dist/$APP_NAME.app" "dist/PyFigures Album.app" "dist/PyFigures Poster.app" dmg_src/
          create-dmg \
            --volname "$APP_NAME" \
            --window-size 600 460 \
            --icon-size 90 \
            --icon "$APP_NAME.app" 150 90 \
            --icon "PyFigures Album.app" 150 220 \
            --icon "PyFigures Poster.app" 150 350 \
            --app-drop-link 450 220 \
            ${{ matrix.artifact_path }} \
            dmg_src

      # -----------------------------------------------------------------------
      # Upload artifacts
      # -----------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Create a GitHub Release and attach artifacts when a tag is pushed
  # ---------------------------------------------------------------------------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          pattern: PyFigures-*
          path: artifacts

      - name: Download the source manifests
        uses: actions/download-artifact@v4
        with:
          pattern: sources-*
          path: manifests

      # GPLv3 section 6(d): the corresponding source is offered from the same
      # place as the executables — every bundled component's source archive
      # (Python packages, Qt, FFmpeg and its libraries + their build scripts)
      - name: Gather the corresponding source
        run: python packaging/collect_licenses.py sources corresponding-source manifests/*/sources.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            corresponding-source/*.tar
          generate_release_notes: true
          # downloads in this order (user 2026-11-24): the MCP Edition first, then the app with the
          # chat sidebar, then the one without AI (the asset list below is alphabetical)
          body: |
            ## Downloads

            | | Windows | macOS (Apple Silicon) | macOS (Intel) | Linux |
            |---|---|---|---|---|
            | **1. PyFigures MCP Edition** (recommended with an AI app) | [zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-MCP-Edition-Windows.zip) | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-MCP-Edition-macOS-AppleSilicon.dmg) | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-MCP-Edition-macOS-Intel.dmg) | [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-MCP-Edition-Linux-x86_64.AppImage) · [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-MCP-Edition-Linux-x86_64.tar.gz) |
            | **2. PyFigures** (with the AI chat sidebar) | [zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-Windows.zip) | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-macOS-AppleSilicon.dmg) | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-macOS-Intel.dmg) | [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-Linux-x86_64.AppImage) · [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-Linux-x86_64.tar.gz) |
            | **3. PyFigures NoAI** (no AI at all) | [zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-NoAI-Windows.zip) | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-NoAI-macOS-AppleSilicon.dmg) | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-NoAI-macOS-Intel.dmg) | [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-NoAI-Linux-x86_64.AppImage) · [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyFigures-NoAI-Linux-x86_64.tar.gz) |

            **1. PyFigures MCP Edition**: for working from an AI app you already use (Mistral Vibe, Claude, Codex, LM Studio, Hermes Agent…) through MCP. It opens without the chat sidebar, shares the open figure with those apps, and at first launch opens Tools → MCP server… to register PyFigures with them (one click each). The AI app then edits the figure in the window, live, one undo step per change. See docs/MCP_SERVER.md.

            **2. PyFigures** opens with the AI chat sidebar (a local model or an online service; untick View → Open the chat at start-up to stop that). It can also be used from another AI app (Model → Another AI app).

            **3. PyFigures NoAI**: the same app without any AI (no chat sidebar, no chat or MCP entries).

            **Microscopy formats:** every app opens Bio-Formats files (.czi, .nd2, .oib, .vsi…) through Fiji. The first time Fiji starts, the app downloads Java 21 and Fiji into your user folder (about 650 MB, 5 to 20 minutes, only once; a window shows the progress).

            **Mac, first launch:** the apps are not signed by Apple. Use *System Settings → Privacy & Security → Open Anyway* (or right-click → Open). If macOS says the app "is damaged and can't be opened", run `xattr -cr "/Applications/<the app>.app"` in Terminal (e.g. `xattr -cr "/Applications/PyFigures MCP Edition.app"`) and open it again.

            The executables are distributed under the GNU GPL v3 (they include PyQt6, Qt and FFmpeg with x264/x265); PyFigures' own source code is BSD-2-Clause. Licence texts are inside each app (Help → About → Third-party licences). The complete corresponding source of everything bundled is attached below (`corresponding-source-*.tar`), together with this repository's source code.
