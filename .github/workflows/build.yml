name: Build Executables

# Trigger on version tags (e.g. v0.1.10) or manually from the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            app_name: PyFigures
            artifact_name: PyFigures-Windows
            artifact_path: PyFigures-Windows.zip
          - os: macos-15-intel    # Intel x86_64 (macos-13 runners were retired in 2025)
            app_name: PyFigures
            artifact_name: PyFigures-macOS-Intel
            artifact_path: PyFigures-macOS-Intel.dmg
          - os: macos-latest      # Apple Silicon (arm64)
            app_name: PyFigures
            artifact_name: PyFigures-macOS-AppleSilicon
            artifact_path: PyFigures-macOS-AppleSilicon.dmg
          # the oldest supported Ubuntu: the app runs on Linux systems with this
          # glibc (2.35) or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+)
          - os: ubuntu-22.04
            app_name: PyFigures
            artifact_name: PyFigures-Linux
            artifact_path: PyFigures-Linux-x86_64.*
          # "PyFigures Web Chat": the same app with Qt WebEngine bundled, opening
          # with Tools > Chat in a web page (experimental, a last resort)
          - os: windows-latest
            web_chat: '1'
            app_name: PyFigures Web Chat
            artifact_name: PyFigures-WebChat-Windows
            artifact_path: PyFigures-WebChat-Windows.zip
          - os: macos-15-intel
            web_chat: '1'
            app_name: PyFigures Web Chat
            artifact_name: PyFigures-WebChat-macOS-Intel
            artifact_path: PyFigures-WebChat-macOS-Intel.dmg
          - os: macos-latest
            web_chat: '1'
            app_name: PyFigures Web Chat
            artifact_name: PyFigures-WebChat-macOS-AppleSilicon
            artifact_path: PyFigures-WebChat-macOS-AppleSilicon.dmg
          # "PyFigures NoAI": no chat sidebar, no chat or MCP entries (PYFIGURES_NO_AI
          # also makes pip install the pyfigures-noai distribution, without qtpy-ai-sidecar)
          - os: windows-latest
            no_ai: '1'
            app_name: PyFigures NoAI
            artifact_name: PyFigures-NoAI-Windows
            artifact_path: PyFigures-NoAI-Windows.zip
          - os: macos-15-intel
            no_ai: '1'
            app_name: PyFigures NoAI
            artifact_name: PyFigures-NoAI-macOS-Intel
            artifact_path: PyFigures-NoAI-macOS-Intel.dmg
          - os: macos-latest
            no_ai: '1'
            app_name: PyFigures NoAI
            artifact_name: PyFigures-NoAI-macOS-AppleSilicon
            artifact_path: PyFigures-NoAI-macOS-AppleSilicon.dmg

    env:
      PYFIGURES_WEB_CHAT: ${{ matrix.web_chat || '0' }}
      PYFIGURES_NO_AI: ${{ matrix.no_ai || '0' }}
      APP_NAME: ${{ matrix.app_name }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3.12, not 3.10: zarr 3 (newer OME-Zarr files) needs 3.11+, and PyMuPDF,
      # which the apps download on request, only has wheels for 3.11+
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Install pyfigures and its dependencies
        # the chat sidebar (qtpy-ai-sidecar) comes with pyfigures itself, and the
        # self-test below fails the build without it; no [pdf] extra: PyMuPDF is
        # AGPL, the apps read PDFs with pypdfium2. Retried while a just-released
        # dependency is not yet on the runners' PyPI mirror.
        shell: bash
        run: bash .github/scripts/pip_install_retry.sh ".[video,zarr]"

      # the web chat app: Qt WebEngine of the same Qt version as PyQt6. A new
      # PyQt6 often comes out before its WebEngine (PyQt6 6.12 had none yet):
      # then PyQt6 goes back to the newest version that has one.
      - name: Qt WebEngine (web chat app)
        if: matrix.web_chat == '1'
        shell: bash
        run: |
          MINOR=$(python -c "from PyQt6.QtCore import PYQT_VERSION_STR as v; print(v.split('.')[1])")
          for m in $(seq "$MINOR" -1 4); do
            if pip install "PyQt6==6.$m.*" "PyQt6-WebEngine==6.$m.*"; then break; fi
            echo "no PyQt6-WebEngine 6.$m, trying 6.$((m-1))"
          done
          python -c "from PyQt6.QtCore import PYQT_VERSION_STR as v; import PyQt6.QtWebEngineWidgets; print('PyQt6', v, 'with WebEngine')"

      # The app bundles GPL/LGPL code (PyQt6, Qt, FFmpeg + x264/x265), so it is
      # distributed under the GPLv3: licence texts go inside the bundle and the
      # corresponding source is attached to the release (see the release job).
      - name: Collect licence notices
        run: python packaging/collect_licenses.py notices third_party

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Build with PyInstaller
        run: pyinstaller pyfigures.spec

      # the built app checks its own contents (Qt SVG, PDF panels with
      # pypdfium2 and no PyMuPDF, H.264 encoder, zarr); fails the build if not
      - name: Self-test of the built app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) APP="dist/$APP_NAME/$APP_NAME.exe" ;;
            macOS) APP="dist/$APP_NAME.app/Contents/MacOS/$APP_NAME" ;;
            *) APP="dist/$APP_NAME/$APP_NAME" ;;
          esac
          QT_QPA_PLATFORM=offscreen "$APP" --self-test self_test.json || { cat self_test.json; exit 1; }
          cat self_test.json

      - name: Licence files next to the executable too (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: cp third_party/THIRD_PARTY_LICENSES.txt third_party/SOURCES.md "dist/$APP_NAME/"

      - name: Upload the source manifest
        uses: actions/upload-artifact@v4
        with:
          name: sources-${{ matrix.artifact_name }}
          path: third_party/sources.json
          retention-days: 30

      # -----------------------------------------------------------------------
      # Package — Windows
      # -----------------------------------------------------------------------
      - name: Package (Windows — zip)
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Path "dist\$env:APP_NAME" -DestinationPath ${{ matrix.artifact_path }}

      # -----------------------------------------------------------------------
      # Package — Linux (portable .tar.gz + AppImage)
      # -----------------------------------------------------------------------
      - name: Package (Linux — tar.gz and AppImage)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          bash packaging/make_linux_packages.sh dist ./appimagetool

      # the AppImage itself runs (unpacked: no FUSE on the runner)
      - name: Self-test of the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./PyFigures-Linux-x86_64.AppImage --self-test appimage_test.json || { cat appimage_test.json; exit 1; }
          cat appimage_test.json

      # -----------------------------------------------------------------------
      # Package — macOS (.app → .dmg)
      # -----------------------------------------------------------------------
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # The photo album and poster designers: small launcher apps running
      # PyFigures.app --album / --poster (on Windows they are "PyFigures Album.exe"
      # and "PyFigures Poster.exe", built by pyfigures.spec)
      - name: Album and poster launchers (macOS)
        if: runner.os == 'macOS' && matrix.web_chat != '1' && matrix.no_ai != '1'
        run: |
          bash packaging/make_macos_launcher_apps.sh dist "$(python -c 'from pyfigures.version import __VERSION__; print(__VERSION__)')"

      - name: Package (macOS — dmg, web chat / no-AI app)
        if: runner.os == 'macOS' && (matrix.web_chat == '1' || matrix.no_ai == '1')
        run: |
          mkdir dmg_src
          cp -R "dist/$APP_NAME.app" dmg_src/
          create-dmg \
            --volname "$APP_NAME" \
            --window-size 600 300 \
            --icon-size 90 \
            --icon "$APP_NAME.app" 150 140 \
            --app-drop-link 450 140 \
            ${{ matrix.artifact_path }} \
            dmg_src

      - name: Package (macOS — dmg)
        if: runner.os == 'macOS' && matrix.web_chat != '1' && matrix.no_ai != '1'
        run: |
          mkdir dmg_src
          cp -R dist/PyFigures.app "dist/PyFigures Album.app" "dist/PyFigures Poster.app" dmg_src/
          create-dmg \
            --volname "PyFigures" \
            --window-size 600 460 \
            --icon-size 90 \
            --icon "PyFigures.app" 150 90 \
            --icon "PyFigures Album.app" 150 220 \
            --icon "PyFigures Poster.app" 150 350 \
            --app-drop-link 450 220 \
            ${{ matrix.artifact_path }} \
            dmg_src

      # -----------------------------------------------------------------------
      # Upload artifacts
      # -----------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Create a GitHub Release and attach artifacts when a tag is pushed
  # ---------------------------------------------------------------------------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          pattern: PyFigures-*
          path: artifacts

      - name: Download the source manifests
        uses: actions/download-artifact@v4
        with:
          pattern: sources-*
          path: manifests

      # GPLv3 section 6(d): the corresponding source is offered from the same
      # place as the executables — every bundled component's source archive
      # (Python packages, Qt, FFmpeg and its libraries + their build scripts)
      - name: Gather the corresponding source
        run: python packaging/collect_licenses.py sources corresponding-source manifests/*/sources.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            corresponding-source/*.tar
          generate_release_notes: true
          body: |
            **PyFigures** opens with the chat sidebar (AI, optional: untick View → Open the chat at start-up). **PyFigures NoAI** (`PyFigures-NoAI-*`): the same app without any AI (no chat sidebar, no chat or MCP entries).

            **Mac, first launch:** the apps are not signed by Apple. Use *System Settings → Privacy & Security → Open Anyway* (or right-click → Open). If macOS says the app "is damaged and can't be opened", run `xattr -cr "/Applications/<the app>.app"` in Terminal (e.g. `xattr -cr "/Applications/PyFigures Web Chat.app"`) and open it again.

            **PyFigures Web Chat** (`PyFigures-WebChat-*`): the same app with Qt WebEngine bundled, opening with the chat web page docked beside the figure (Tools → Chat in a web page). Experimental and not recommended: a last resort when the chat sidebar (API key or local model) cannot be used. Check the chat site's terms of service and your institution's rules first. See docs/WEB_CHAT_TUTORIAL.md.

            The executables are distributed under the GNU GPL v3 (they include PyQt6, Qt and FFmpeg with x264/x265); PyFigures' own source code is BSD-2-Clause. Licence texts are inside each app (Help → About → Third-party licences). The complete corresponding source of everything bundled is attached below (`corresponding-source-*.tar`), together with this repository's source code.
