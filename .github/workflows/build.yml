name: Build Executables

# Trigger on version tags (e.g. v0.1.10) or manually from the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PyFigures-Windows
            artifact_path: PyFigures-Windows.zip
          - os: macos-15-intel    # Intel x86_64 (macos-13 runners were retired in 2025)
            artifact_name: PyFigures-macOS-Intel
            artifact_path: PyFigures-macOS-Intel.dmg
          - os: macos-latest      # Apple Silicon (arm64)
            artifact_name: PyFigures-macOS-AppleSilicon
            artifact_path: PyFigures-macOS-AppleSilicon.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Install pyfigures and its dependencies
        run: pip install ".[video]"

      # The app bundles GPL/LGPL code (PyQt6, Qt, FFmpeg + x264/x265), so it is
      # distributed under the GPLv3: licence texts go inside the bundle and the
      # corresponding source is attached to the release (see the release job).
      - name: Collect licence notices
        run: python packaging/collect_licenses.py notices third_party

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Build with PyInstaller
        run: pyinstaller pyfigures.spec

      - name: Licence files next to the executable too (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp third_party/THIRD_PARTY_LICENSES.txt third_party/SOURCES.md dist/PyFigures/

      - name: Upload the source manifest
        uses: actions/upload-artifact@v4
        with:
          name: sources-${{ matrix.artifact_name }}
          path: third_party/sources.json
          retention-days: 30

      # -----------------------------------------------------------------------
      # Package — Windows
      # -----------------------------------------------------------------------
      - name: Package (Windows — zip)
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Path dist\PyFigures -DestinationPath PyFigures-Windows.zip

      # -----------------------------------------------------------------------
      # Package — macOS (.app → .dmg)
      # -----------------------------------------------------------------------
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Package (macOS-Intel — dmg)
        if: matrix.os == 'macos-15-intel'
        run: |
          create-dmg \
            --volname "PyFigures" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            PyFigures-macOS-Intel.dmg \
            dist/PyFigures.app

      - name: Package (macOS-AppleSilicon — dmg)
        if: matrix.os == 'macos-latest'
        run: |
          create-dmg \
            --volname "PyFigures" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            PyFigures-macOS-AppleSilicon.dmg \
            dist/PyFigures.app

      # -----------------------------------------------------------------------
      # Upload artifacts
      # -----------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Create a GitHub Release and attach artifacts when a tag is pushed
  # ---------------------------------------------------------------------------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          pattern: PyFigures-*
          path: artifacts

      - name: Download the source manifests
        uses: actions/download-artifact@v4
        with:
          pattern: sources-*
          path: manifests

      # GPLv3 section 6(d): the corresponding source is offered from the same
      # place as the executables — every bundled component's source archive
      # (Python packages, Qt, FFmpeg and its libraries + their build scripts)
      - name: Gather the corresponding source
        run: python packaging/collect_licenses.py sources corresponding-source manifests/*/sources.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            corresponding-source/*.tar
          generate_release_notes: true
          body: |
            The executables are distributed under the GNU GPL v3 (they include PyQt6, Qt and FFmpeg with x264/x265); PyFigures' own source code is BSD-2-Clause. Licence texts are inside each app (Help → About → Third-party licences). The complete corresponding source of everything bundled is attached below (`corresponding-source-*.tar`), together with this repository's source code.
