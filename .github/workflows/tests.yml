name: Tests

# The whole test suite (GUI actions headless, recipes, MCP tools, exports) on
# Windows, macOS and Linux, on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    env:
      QT_API: pyqt6
      PYTEST_QT_API: pyqt6
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      # companion packages; a repository variable can point them at a git URL
      # (e.g. git+https://github.com/<user>/<repo>) before they are on PyPI
      BATOOLSET_SPEC: ${{ vars.BATOOLSET_SPEC || 'batoolset' }}
      BATOOLSET_GUI_SPEC: ${{ vars.BATOOLSET_GUI_SPEC || 'batoolset-gui' }}
      STAPLOT_SPEC: ${{ vars.STAPLOT_SPEC || 'staplot' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install pyfigures, its companions and the test tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "$BATOOLSET_SPEC" "$BATOOLSET_GUI_SPEC" "$STAPLOT_SPEC"
          pip install ".[ai,video,zarr]" pytest pytest-qt

      - name: Run the test suite
        run: python -m pytest -q -p no:cacheprovider tests
