name: Mac video check

# Plays the exported sample videos (tests/mac_check/samples, made by
# tests/mac_check/make_samples.py) with Apple's own decoder — the one QuickTime,
# Safari, Keynote and PowerPoint use — on Intel and Apple Silicon Macs.
# Run it from the Actions tab, or it runs by itself when the samples change.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/mac_check/**'
      - '.github/workflows/mac_video_check.yml'

jobs:
  play:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]     # Intel x86_64, Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'               # same as the packaged-app build
      - name: Install AVFoundation bindings and PyAV
        run: pip install numpy av pyobjc-framework-AVFoundation pyobjc-framework-Quartz
      - name: PyAV's Mac wheel can encode H.264 (what the packaged app bundles)
        run: python -c "import av; print('av', av.__version__); print(av.codec.Codec('libx264', 'w').long_name)"
      - name: Play every sample with AVFoundation
        run: python tests/mac_check/check_on_mac.py
