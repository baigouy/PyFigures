[pytest]
# a bare `pytest` must not crawl the archives (chatGPT_validation, build, ...)
testpaths = tests
# pytest-timeout: a test stuck on a modal dialog fails after 10 min instead of
# hanging the whole run (a QMessageBox once blocked it for 36 min)
timeout = 600
norecursedirs = chatGPT_validation build packaging docs images *.egg-info __pycache__ .git .idea
