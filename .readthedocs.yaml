# Read the Docs: https://pyfigures.readthedocs.io
# The site is built by MkDocs (mkdocs.yml); the pages generated at build time
# come from gen_ref_pages.py. The examples' images are pre-rendered and
# committed (docs/examples/build_examples.py), since building them needs Qt.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
